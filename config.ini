; ============================================================
; FuzzingLocalBot Configuration
; ============================================================

[General]
; Default browser (chrome, edge, firefox, brave, opera)
browser = chrome

; Show VPN warning on startup
show_vpn_warning = true

; Typing speed (milliseconds between keystrokes)
typing_speed = 2

; Delay between tabs (milliseconds)
tab_delay = 300

; ============================================================
; Python Backend Configuration
; ============================================================

[Backend]
; Number of threads for parallel scanning
threads = 50

; Request timeout (seconds)
timeout = 3

; Number of retries on failure
retries = 2
